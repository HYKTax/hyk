<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>HYK Tax Dashboard</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>

<style>
body { font-family: Arial; background:#f5f7fb; padding:20px; }
h1 { margin-bottom:10px; }
.card { background:#fff; padding:15px; border-radius:10px; margin-bottom:15px; }
table { width:100%; border-collapse: collapse; }
th, td { padding:8px; border-bottom:1px solid #ddd; text-align:left; }
</style>
</head>

<body>

<h1>HYK Tax Dashboard</h1>
<p>Last Refresh: <span id="refresh-time"></span></p>

<div class="card">
  <canvas id="statusChart"></canvas>
</div>

<div class="card">
  <table>
    <thead>
      <tr>
        <th>Client</th>
        <th>Status</th>
        <th>Type</th>
        <th>Fee</th>
      </tr>
    </thead>
    <tbody id="table-body"></tbody>
  </table>
</div>

<script>
const TODAY = new Date();
let RAW = [];

/* ================= CSV PARSER ================= */
function parseCSV(text) {
  return text.trim().split("\n").map(row =>
    row.match(/(".*?"|[^",]+)(?=\s*,|\s*$)/g)
  );
}

/* ================= DATE FORMAT ================= */
function convertDate(val) {
  if (!val) return "";
  const d = new Date(val);
  return isNaN(d) ? "" : d.toISOString().split("T")[0];
}

/* ================= LOAD DATA ================= */
async function loadData() {
  try {
    const url = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSP-WFJVee7OU7RbP7g55ZXSB66gQF_8iPxwU5DKfGACf8Xit1N2Q_Gu6Yois8QoA/pub?gid=1845055850&single=true&output=csv&t=" + Date.now();

    const res = await fetch(url);
    const text = await res.text();

    const rows = parseCSV(text);

    // skip top 2 rows
    const headers = rows[2].map(h => h.trim());

    RAW = rows.slice(3).map((row, i) => {
      let obj = {};
      headers.forEach((h, j) => obj[h] = row[j]);

      return {
        client: obj["Client Name"] || "",
        status: obj["Return Status"] || "",
        type: obj["Return Type"] || "",
        fee: Number((obj["Return Fees ($)"] || "0").replace(/[$,]/g, ""))
      };
    });

    refreshAll();

    document.getElementById("refresh-time").textContent =
      new Date().toLocaleTimeString();

  } catch (err) {
    console.error(err);
    alert("❌ Failed to load Google Sheet");
  }
}

/* ================= TABLE ================= */
function renderTable() {
  const tbody = document.getElementById("table-body");
  tbody.innerHTML = RAW.map(r => `
    <tr>
      <td>${r.client}</td>
      <td>${r.status}</td>
      <td>${r.type}</td>
      <td>$${r.fee}</td>
    </tr>
  `).join("");
}

/* ================= CHART ================= */
let chart;
function renderChart() {
  const counts = {};
  RAW.forEach(r => {
    counts[r.status] = (counts[r.status] || 0) + 1;
  });

  if (chart) chart.destroy();

  chart = new Chart(document.getElementById("statusChart"), {
    type: "doughnut",
    data: {
      labels: Object.keys(counts),
      datasets: [{ data: Object.values(counts) }]
    }
  });
}

/* ================= REFRESH ================= */
function refreshAll() {
  renderTable();
  renderChart();
}

/* ================= INIT ================= */
window.onload = () => {
  loadData();
  setInterval(loadData, 60000);
};
</script>

</body>
</html>
