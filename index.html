<script>
/* ================================
   GLOBAL DATA
================================ */
let RAW = [];

/* ================================
   SAFE CSV PARSER (handles commas)
================================ */
function parseCSV(text) {
  return text.trim().split("\n").map(row => {
    return row.match(/(".*?"|[^",]+)(?=\s*,|\s*$)/g);
  });
}

/* ================================
   LOAD DATA FROM GOOGLE SHEETS
================================ */
async function loadData() {
  try {
    const url = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSP-WFJVee7OU7RbP7g55ZXSB66gQF_8iPxwU5DKfGACf8Xit1N2Q_Gu6Yois8QoA/pub?gid=1845055850&single=true&output=csv&t=" + Date.now();

    const res = await fetch(url, { cache: "no-store" });
    const text = await res.text();

    console.log("📄 RAW CSV:", text);

    const rows = parseCSV(text);
    const headers = rows[0].map(h => h.trim());

    RAW = rows.slice(1).map(row => {
      let obj = {};
      headers.forEach((h, i) => obj[h] = row[i]);

      return {
        id: Number(obj.id || obj.ID || 0),
        client: obj.client || obj.Client || "",
        type: obj.type || obj.Type || "",
        status: obj.status || obj.Status || "",
        priority: obj.priority || obj.Priority || "",
        preparer: obj.preparer || obj.Preparer || "",
        reviewer: obj.reviewer || obj.Reviewer || "",
        docsDate: obj.docsDate || obj.DocsDate || "",
        efileDate: obj.efileDate || obj.EfileDate || "",
        origDue: obj.origDue || obj.OrigDue || "",
        extDue: obj.extDue || obj.ExtDue || "",
        ext: obj.ext || obj.Ext || "",
        hours: Number(obj.hours || obj.Hours || 0),
        fee: Number(obj.fee || obj.Fee || 0),
        paid: obj.paid || obj.Paid || "",
        remarks: obj.remarks || obj.Remarks || ""
      };
    });

    console.log("✅ Parsed Data:", RAW);

    refreshAll();

  } catch (err) {
    console.error("❌ Error loading data:", err);
    alert("Failed to load Google Sheets data");
  }
}

/* ================================
   AUTO LOAD + AUTO SYNC
================================ */
loadData();
setInterval(loadData, 60000); // refresh every 60 sec

</script>
